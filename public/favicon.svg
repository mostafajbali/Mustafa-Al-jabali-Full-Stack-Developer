<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A1022" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>

  <!-- Base container (rounded square / squircle) with deep contrast & glowing border -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Inner subtle ambient glow -->
  <rect x="6" y="6" width="52" height="52" rx="11" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.18" />

  <!-- Code2 Developer Icon: < / > (Thick, crisp, and high-visibility at small favicon sizes) -->
  <!-- Left Bracket < -->
  <polyline points="22 20 11 32 22 44" fill="none" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Slash / -->
  <line x1="36" y1="17" x2="28" y2="47" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" />

  <!-- Right Bracket > -->
  <polyline points="42 20 53 32 42 44" fill="none" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top accent indicator -->
  <circle cx="32" cy="10.5" r="2" fill="#00F0FF" />
</svg>
